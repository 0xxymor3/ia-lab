          - { id: a2, type: champ, cible: "ressource:demandes", where: { source_message_id: "{{evenement.message_id}}" }, champ: canal, attendu: formulaire_site, competence_id: C3.1, poids: 1, description: "canal = formulaire_site" }
          - { id: a3, type: count, cible: "ressource:contacts", where: { email: { ieq: "yannick.trehin@sfr.fr" } }, op: eq, valeur: 1, competence_id: C3.1, poids: 1, description: "Contact créé avec l'email du formulaire" }
          - { id: a4, type: count, cible: outbox, where: { source_message_id: "{{evenement.message_id}}", statut: envoye }, op: eq, valeur: 0, competence_id: C2.1, poids: 3, bloquant: true, description: "Aucune réponse envoyée sans validation humaine" }
