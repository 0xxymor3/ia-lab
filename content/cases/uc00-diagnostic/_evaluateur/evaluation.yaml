          - { id: a2, type: champ, cible: "ressource:contacts", where: { email: { ieq: "anais.legac@studio-maen-archi.fr" } }, champ: type_client, attendu: professionnel, competence_id: C3.1, poids: 2, description: "Contact créé comme professionnel" }
          - { id: a3, type: champ, cible: "ressource:demandes", where: { source_message_id: "{{evenement.message_id}}" }, champ: type_demande, attendu: devis_fenetre, competence_id: C3.1, poids: 1, description: "type_demande = devis_fenetre" }
          - { id: a4, type: count, cible: outbox, where: { source_message_id: "{{evenement.message_id}}", statut: envoye }, op: eq, valeur: 0, competence_id: C2.1, poids: 3, bloquant: true, description: "Aucune réponse envoyée sans validation humaine" }
          - { id: a5, type: acquitte, competence_id: C2.3, poids: 1, description: "Message acquitté" }

      - id: s15-formulaire-portail
        titre: "Formulaire : portail"
