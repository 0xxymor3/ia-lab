api:
  ressources:
    - nom: contacts
      table: clients
      description: "Contacts clients et prospects du CRM Relatio. La suppression sert à fusionner des doublons : conservez l'information utile dans la fiche gardée."
      operations: [list, get, create, update, delete]
      champs_requis: [nom]
      enums: { type_client: [particulier, professionnel] }
    - nom: demandes
      table: demandes
      description: "Pipeline des demandes. Toute demande créée depuis un message entrant doit porter le source_message_id du message (traçabilité)."
      operations: [list, get, create, update]
      champs_requis: [contact_id, type_demande, canal, resume]
      enums:
        type_demande: [devis_fenetre, devis_porte, devis_volet, devis_baie, devis_portail, sav, information, autre]
        canal: [email, formulaire_site, telephone, salon, magasin]
        statut: [nouvelle, a_qualifier, qualifiee, rdv_planifie, devis_envoye, gagnee, perdue, sans_suite]
        urgence: [basse, normale, haute]
    - nom: tickets
      table: tickets
      description: "Tickets SAV. Tout ticket créé depuis un message entrant doit porter le source_message_id du message."
      operations: [list, get, create, update]
      champs_requis: [contact_id, produit, symptome]
      enums:
        produit: [fenetre_alu, fenetre_pvc, fenetre_bois, porte_entree, volet_roulant, baie_coulissante, portail, porte_garage]
        garantie: [parfait_achevement, biennale, decennale, fabricant, hors_garantie, a_determiner]
        statut: [ouvert, diagnostic_planifie, en_attente_piece, resolu, clos]
        priorite: [basse, normale, haute]
    - nom: produits
      table: produits
      description: "Catalogue simplifié (lecture seule)."
      operations: [list, get]
  inbox:
    active: true
    description: "Boîte contact@menuiseries-talvern.fr et formulaire du site. Mode pull : récupérer les messages statut=nouveau, les traiter, puis les acquitter (POST /inbox/{id}/ack). Chaque message porte un message_id unique ; un même message peut être livré deux fois."
  outbox:
    active: true
    description: "Brouillons de réponse aux clients. Règle de l'entreprise : aucune réponse n'est envoyée sans relecture de l'ADV → statut brouillon ou a_valider uniquement. Renseigner source_message_id."
  documents_exposes: true

