schema_version: "1.0"

meta:
  id: uc00-diagnostic
  titre: "UC00 — Diagnostic de positionnement : Menuiseries Talvern"
  sous_titre: "Des demandes de devis qui s'accumulent, un SAV qui cherche ses notices et une dirigeante qui veut « son ChatGPT »"
  type: diagnostic
  secteur: "Menuiserie extérieure — fabrication et pose (BTP second œuvre)"
  localisation: "Elven, Morbihan (56)"
  duree_estimee_jours: 5.5
  niveau_vise: N3
  postes_vises: [ai-automation-engineer, ai-integrator, ai-product-builder, ai-architect, consultant-formateur-ia]
  resume: >-
    Cas de positionnement en quatre paliers de difficulté croissante couvrant les 7 blocs.
    S'arrêter à un palier est une information en soi : le niveau par bloc correspond au palier
    le plus élevé réussi. Les paliers P2 et P3 sont notés automatiquement par le testeur.
  date_creation: "2026-09-18"
  version: "1.0"
  competences_cibles:
    - { id: C1.1, niveau: N3, justification: "Les chiffres donnés par la direction sont contradictoires : il faut les recalculer à partir des données (délais, temps ADV)." }
    - { id: C1.2, niveau: N3, justification: "La demande initiale (« un ChatGPT maison ») est un faux bon cas qu'il faut requalifier." }
    - { id: C1.3, niveau: N3, justification: "Budget contraint (18 k€ HT, 250 €/mois) : business case chiffré obligatoire." }
    - { id: C1.4, niveau: N3, justification: "Attentes divergentes entre dirigeante, DAF, commercial et ADV à arbitrer dans une note de cadrage." }
    - { id: C2.1, niveau: N3, justification: "Workflow de traitement des demandes entrantes avec validation humaine." }
    - { id: C2.2, niveau: N3, justification: "API CRM paginée, clé d'API, rapprochement de contacts existants." }
    - { id: C2.3, niveau: N3, justification: "Messages livrés en double, pannes et limites de débit simulées." }
    - { id: C2.4, niveau: N2, justification: "Runbook et transfert à un référent informatique à mi-temps." }
    - { id: C3.1, niveau: N3, justification: "Classification et extraction structurées sur des messages hétérogènes (spam, anglais, formulaire, candidature)." }
    - { id: C3.2, niveau: N3, justification: "Assistant SAV sur des notices et procédures, avec questions hors corpus." }
    - { id: C3.4, niveau: N2, justification: "Évaluation chiffrée de l'assistant SAV." }
    - { id: C4.1, niveau: N2, justification: "Nœud Code ou script de normalisation." }
    - { id: C4.2, niveau: N3, justification: "CRM importé d'Excel avec doublons et formats incohérents." }
    - { id: C5.1, niveau: N3, justification: "Architecture cible dimensionnée pour une PME sans DSI." }
    - { id: C5.2, niveau: N3, justification: "Exigence d'hébergement européen du DAF." }
    - { id: C5.3, niveau: N3, justification: "Injection de prompt et données bancaires dans les messages entrants." }
    - { id: C5.4, niveau: N2, justification: "Indicateurs de suivi attendus par la direction." }
    - { id: C6.1, niveau: N3, justification: "Données de particuliers, candidatures, IBAN : minimisation et base légale." }
    - { id: C6.2, niveau: N3, justification: "Réponses automatisées aux clients : transparence (art. 50) ; littératie des équipes (art. 4)." }
    - { id: C6.3, niveau: N3, justification: "Shadow AI avéré chez les commerciaux et l'ADV." }
    - { id: C7.1, niveau: N2, justification: "Interface de validation des brouillons pour l'ADV." }
    - { id: C7.2, niveau: N3, justification: "Pitch à une dirigeante enthousiaste et un DAF sceptique." }
    - { id: C7.3, niveau: N3, justification: "Responsable ADV réticente, chef d'atelier opposé." }
    - { id: C7.4, niveau: N3, justification: "Plan de formation des équipes (littératie IA)." }

entreprise:
  nom: "Menuiseries Talvern"
  forme_juridique: "SAS au capital de 180 000 €"
  effectif: 38
  chiffre_affaires: "6,2 M€ HT (2025)"
  creation: 1994
  adresse: "14 rue des Charpentiers, ZA de Lann Vras, 56250 Elven (adresse fictive)"
  activite_md: |
    Fabrication (aluminium et bois) et pose de **menuiseries extérieures** : fenêtres, baies coulissantes, portes d'entrée, volets, portails et portes de garage. Le PVC est acheté en négoce auprès d'un fabricant partenaire puis posé par les équipes Talvern.

    - **Atelier** (Elven) : 12 personnes, découpe et assemblage alu, menuiserie bois.
    - **Pose** : 5 équipes de 2 poseurs, zone Morbihan et nord Loire-Atlantique.
    - **Bureau** : direction, administration des ventes (ADV), commerciaux, comptabilité, SAV.
    - Entreprise certifiée **RGE** (Qualibat) : une part importante des chantiers de particuliers est liée à la rénovation énergétique.
  histoire_md: |
    Fondée en 1994 par **Yves Talvern**, menuisier, l'entreprise a grandi grâce au bouche-à-oreille et aux chantiers de rénovation autour du golfe du Morbihan. Sa fille **Gwenola Talvern** l'a reprise en 2016 après quinze ans dans la grande distribution. Elle a professionnalisé la partie commerciale (showroom en 2019, site web en 2020, CRM en 2024) mais les outils se sont empilés sans être reliés.

    Depuis 2024, la croissance ralentit : les demandes de devis restent nombreuses mais le taux de transformation baisse. Les concurrents régionaux promettent « un devis sous 48 h ». En juin 2026, le comité de direction a inscrit « l'IA » dans ses priorités, après une matinale de la CCI sur le sujet.
  chiffres_cles:
    - { label: "Chiffre d'affaires 2025", valeur: "6,2 M€ HT (−3 % vs 2024)" }
    - { label: "Chantiers réalisés / an", valeur: "≈ 1 900" }
    - { label: "Part des particuliers", valeur: "≈ 70 % du CA" }
    - { label: "Panier moyen particulier", valeur: "≈ 7 800 € TTC" }
    - { label: "Taux de transformation des devis", valeur: "« autour de 35 % » selon la direction (non mesuré précisément)" }
    - { label: "Effectif bureau", valeur: "11 personnes" }
    - { label: "Budget projet IA année 1", valeur: "18 000 € HT (hors aides), exploitation ≤ 250 €/mois" }
  clients_md: |
    - **Particuliers** (≈ 70 %) : rénovation de maisons individuelles, résidences secondaires sur le littoral (Carnac, Quiberon, Sarzeau), dossiers d'aides à la rénovation énergétique.
    - **Professionnels** (≈ 30 %) : architectes, promoteurs régionaux, syndics de copropriété, quelques collectivités via marchés publics.
    - Zone d'intervention : **Morbihan** et **nord de la Loire-Atlantique** (Blain, Nozay, Savenay, Châteaubriant). Pas de chantier dans la métropole nantaise ni hors de ces départements.
  culture_md: |
    Culture artisanale forte, fierté du travail bien fait, forte ancienneté à l'atelier. Au bureau, beaucoup de choses reposent sur la mémoire de quelques personnes. Les outils numériques sont vus comme « des trucs en plus à remplir ». La dirigeante est enthousiaste, parfois perçue comme « changeant de priorité tous les trois mois ».
  enjeux:
    - "Répondre plus vite aux demandes de devis sans recruter à l'ADV"
    - "Fiabiliser le fichier clients (doublons, relances impossibles)"
    - "Aider les techniciens SAV à trouver la bonne information (notices, garanties, procédures)"
    - "Encadrer l'usage d'outils d'IA grand public par les salariés"
    - "Préparer la transmission des savoir-faire de l'atelier (départ en retraite du chef d'atelier en 2028)"
    - "Absorber la réception des factures électroniques (obligatoire depuis le 1er septembre 2026)"

