    objectif: "Transformer une demande floue et des chiffres contradictoires en une note de cadrage chiffrée, conforme et arbitrable."
    duree_estimee_h: 8
    competences: [C1.1, C1.2, C1.3, C1.4, C6.1, C6.2, C6.3, C7.3]
    consignes_md: |
      Vous êtes le/la consultant·e retenu·e par Gwenola Talvern. Avant de construire quoi que ce soit, produisez un **dossier de cadrage** destiné à la direction (Gwenola et Hervé).

      1. **Diagnostic** : cartographiez le traitement actuel d'une demande de devis (de la réception à l'envoi du devis) et **quantifiez-le à partir des données fournies** (délais réels du pipeline, volumes par canal et par type, temps passé par l'ADV). Confrontez vos chiffres à ceux cités en réunion.
      2. **Cas d'usage** : listez au moins 6 cas d'usage IA ou automatisation, qualifiez-les (données, faisabilité, risques, dépendances) et **écartez explicitement** au moins un « faux bon cas », en le justifiant.
      3. **Priorisation et business case** : matrice valeur / effort ; pour les 2 cas prioritaires, un business case chiffré respectant le budget (18 k€ HT, ≤ 250 €/mois), hypothèses explicites.
      4. **Conformité** : pour les cas retenus, cartographie des données personnelles, base légale, minimisation, points d'attention fournisseurs (hébergement, sous-traitance), qualification AI Act (rôle, niveau de risque, transparence art. 50, littératie art. 4).
      5. **Gouvernance** : un projet de **charte d'usage de l'IA** (1 à 2 pages) répondant au shadow AI constaté, applicable par des non-spécialistes.
      6. **Parties prenantes** : carte influence / attitude et premières actions d'accompagnement (dont Soazig et Thierry).

      Format libre (document de 8 à 12 pages maximum + annexes). Joignez votre journal d'usage de l'IA.
    livrables:
      - { id: note-cadrage, nom: "Note de cadrage", format: "PDF ou page web", description: "Diagnostic chiffré, cas d'usage, priorisation, business case, périmètre du MVP, critères de succès." }
      - { id: cartographie, nom: "Cartographie AS-IS", format: "Schéma (Mermaid, Excalidraw…)", description: "Traitement d'une demande de devis, acteurs, outils, ruptures." }
      - { id: analyse-conformite, nom: "Analyse RGPD / AI Act", format: "Tableau ou fiche", description: "Pour les cas retenus." }
      - { id: charte-ia, nom: "Charte d'usage de l'IA", format: "1-2 pages", description: "Règles simples, outils autorisés, données interdites." }
      - { id: carte-parties-prenantes, nom: "Carte des parties prenantes", format: "Matrice", description: "Influence / attitude + actions." }
    criteres:
      - { id: P1-C1, competence_id: C1.1, indicateur: "Délais et volumes recalculés à partir des données (et non repris des déclarations), écarts avec les chiffres cités expliqués" }
      - { id: P1-C2, competence_id: C1.2, indicateur: "≥ 6 cas qualifiés ; « ChatGPT maison répondant seul aux clients » requalifié ou écarté avec justification" }
      - { id: P1-C3, competence_id: C1.3, indicateur: "Business case avec coûts d'exploitation (dont tokens), gains mesurables, hypothèses et temps de retour, dans le budget" }
      - { id: P1-C4, competence_id: C1.4, indicateur: "Périmètre du MVP, critères de succès mesurables, arbitrages proposés entre Gwenola, Hervé, Franck et Soazig" }
      - { id: P1-C5, competence_id: C6.1, indicateur: "Données personnelles cartographiées, base légale et minimisation justifiées ; candidatures et IBAN traités à part" }
      - { id: P1-C6, competence_id: C6.2, indicateur: "Qualification AI Act correcte (déployeur, pas de haut risque pour les cas retenus sauf justification) et calendrier post-Omnibus exact" }
      - { id: P1-C7, competence_id: C6.3, indicateur: "Charte applicable : outils autorisés, données interdites, validation humaine, transparence" }
      - { id: P1-C8, competence_id: C7.3, indicateur: "Carte des parties prenantes et actions concrètes pour Soazig (réticente) et Thierry (bloquant)" }

  - id: P2
    titre: "Automatiser le traitement des demandes entrantes"
    objectif: "Chaque message entrant est classé, rattaché au bon contact, enregistré dans le CRM et reçoit un brouillon de réponse relu par l'ADV — de façon fiable et sûre."
    duree_estimee_h: 12
    competences: [C2.1, C2.2, C2.3, C2.4, C3.1, C5.3, C6.1]
    consignes_md: |
      Construisez avec **n8n** (ou l'outil de votre choix) le workflow de traitement de la boîte contact@. Utilisez l'**API sandbox** (onglet *Doc API*) : inbox, contacts, demandes, tickets, outbox.

      **Règles métier à respecter**
      - Classer chaque message : demande de devis (avec le bon `type_demande`), SAV, information, candidature, fournisseur, spam, autre.
      - **Devis** → retrouver le contact existant (par email, sans tenir compte de la casse) ou le créer ; créer une **demande** avec `canal` (`email` ou `formulaire_site`), `type_demande`, `resume`, `code_postal`/`commune` si connus, `urgence`, et **`source_message_id`** = `message_id` du message entrant. Si des informations essentielles manquent, `a_verifier: true` et un brouillon qui les demande.
      - **SAV** → créer un **ticket** (`produit`, `symptome`, `priorite`, `source_message_id`) — pas de demande.
      - **Zone d'intervention** : respecter la FAQ commerciale (documents internes). Hors zone : pas de demande, un brouillon de réponse courtois.
      - **Candidatures, fournisseurs, spam** : rien dans le CRM commercial.
      - **Réponses** : un brouillon par message nécessitant une réponse, déposé dans l'outbox avec `statut: brouillon` (ou `a_valider`) et `source_message_id`. **Jamais `envoye`.**
      - **Données sensibles** : aucune coordonnée bancaire ne doit être recopiée dans le CRM.
      - **Traçabilité et idempotence** : un même `message_id` livré deux fois ne doit produire qu'un seul enregistrement. Acquitter chaque message traité.

      **Vérification** : lancez la campagne « Flux entrants — septembre » depuis le **Testeur**, laissez votre workflow traiter l'inbox, puis cliquez sur **Vérifier**. Relancez-la avec le **mode chaos** activé (429, 503, latence) : votre workflow doit tenir.

      **Livrables** : blueprint, export JSON du workflow (sans secrets), prompt(s) versionné(s), résultats du testeur (normal + chaos), runbook d'une page pour Yann Le Du.
    livrables:
      - { id: blueprint-p2, nom: "Blueprint du workflow", format: "Schéma + texte", description: "Déclencheur, étapes, données, branches, erreurs, validation humaine." }
      - { id: export-n8n-p2, nom: "Export du workflow", format: "JSON n8n", description: "Sans identifiants ni clés." }
      - { id: prompts-p2, nom: "Prompts versionnés", format: "Markdown", description: "Prompt système, schéma de sortie, exemples." }
      - { id: resultats-p2, nom: "Résultats du testeur", format: "Export JSON", description: "Campagne normale et campagne en mode chaos." }
      - { id: runbook-p2, nom: "Runbook", format: "1 page", description: "Exploitation, reprise sur erreur, secrets, contacts." }
    criteres:
      - { id: P2-C1, competence_id: C2.1, indicateur: "Blueprint documenté avant construction, validation humaine explicite" }
      - { id: P2-C2, competence_id: C2.2, indicateur: "Appels API corrects (auth, pagination, rapprochement de contact)" }
      - { id: P2-C3, competence_id: C2.3, indicateur: "Idempotence sur message_id, retry sur 429/503, messages en échec isolés" }
      - { id: P2-C4, competence_id: C2.4, indicateur: "Runbook exploitable par le référent, secrets hors workflow" }
      - { id: P2-C5, competence_id: C3.1, indicateur: "Sortie structurée validée, catégorie d'incertitude, robustesse (anglais, formulaire, spam)" }
      - { id: P2-C6, competence_id: C5.3, indicateur: "Aucune action déclenchée par une injection de prompt", bloquant: true }
      - { id: P2-C7, competence_id: C6.1, indicateur: "Minimisation : pas d'IBAN ni de candidature dans le CRM commercial" }

  - id: P3
    titre: "Assistant SAV et qualité des données"
    objectif: "Donner aux techniciens un assistant fiable sur la documentation interne et assainir le fichier clients."
    duree_estimee_h: 12
    competences: [C3.2, C3.4, C4.1, C4.2]
    consignes_md: |
      **A. Assistant SAV (RAG)**
      - Récupérez les documents via `GET /documents` (Markdown) et construisez un assistant qui répond aux questions des techniciens **en citant ses sources** (identifiants de documents) et qui **refuse de répondre** quand l'information n'est pas dans la documentation.
      - Lancez la campagne « Questions des techniciens SAV » dans le **Testeur**, récupérez les questions (`GET /rag/questions`), soumettez vos réponses (`POST /rag/answers`), puis **Vérifiez**.
      - Constituez votre propre jeu d'évaluation (au moins 10 questions) **avant** d'optimiser, et comparez au moins deux configurations (découpage, modèle ou prompt) de façon chiffrée.

      **B. Assainissement du CRM**
      - Auditez la qualité de la ressource `contacts` (doublons, formats, espaces, emails invalides).
      - Écrivez un **nœud Code ou un script** (JavaScript ou Python) qui normalise les téléphones au format **E.164** (`+33612345678`), met les emails en minuscules sans espaces, supprime les espaces parasites des noms, et **fusionne les doublons** selon des règles explicites (sans supprimer d'information utile).
      - Appliquez vos corrections via l'API, puis lancez la campagne « Qualité du fichier clients » et **Vérifiez**.

      **Livrables** : note technique (choix, limites, résultats chiffrés), jeu d'évaluation, code, résultats du testeur.
    livrables:
      - { id: assistant-sav, nom: "Assistant SAV", format: "Workflow n8n ou code", description: "RAG avec citations et refus hors corpus." }
      - { id: jeu-eval, nom: "Jeu d'évaluation", format: "Tableur ou JSON", description: "≥ 10 questions, résultats de ≥ 2 configurations." }
      - { id: script-qualite, nom: "Script de nettoyage", format: "JS ou Python", description: "Normalisation et fusion des doublons, règles explicites." }
      - { id: note-technique-p3, nom: "Note technique", format: "2-3 pages", description: "Choix, limites, résultats chiffrés." }
    criteres:
      - { id: P3-C1, competence_id: C3.2, indicateur: "Score RAG ≥ 80 %, sources citées, refus corrects hors corpus" }
      - { id: P3-C2, competence_id: C3.4, indicateur: "Jeu d'évaluation construit avant optimisation, comparaison chiffrée de 2 configurations" }
      - { id: P3-C3, competence_id: C4.1, indicateur: "Code lisible, testé, gestion d'erreurs" }
      - { id: P3-C4, competence_id: C4.2, indicateur: "Doublons fusionnés par règles explicites, formats normalisés, aucune suppression massive", bloquant: true }

  - id: P4
    titre: "Architecture cible et restitution"
    objectif: "Proposer une trajectoire crédible, sûre et finançable, et convaincre une dirigeante enthousiaste et un DAF sceptique."
    duree_estimee_h: 8
    competences: [C5.1, C5.2, C5.4, C7.1, C7.2, C7.4, C1.3]
    consignes_md: |
      1. **Dossier d'architecture cible** (4-6 pages) : schéma des composants et des flux (boîte contact, formulaire, n8n, LLM, CRM, documents, validation ADV, supervision), **dossier de choix** du modèle et de l'hébergement (au moins 2 options comparées, dont une option d'hébergement dans l'UE), coût mensuel estimé, menaces principales et mesures (OWASP LLM), indicateurs de supervision, réversibilité.
      2. **Interface de validation** : maquette de l'écran (ou de la vue) qui permet à l'ADV de relire et valider les brouillons en moins de 30 secondes par message.
      3. **Pitch deck** (8-12 slides) pour Gwenola et Hervé : problème chiffré, solution, démonstration, coûts, risques, feuille de route 6 mois, décision attendue. Prévoyez les objections d'Hervé.
      4. **Plan d'accompagnement et de formation** : littératie IA pour tous (art. 4), formation spécifique ADV et commerciaux, rôle de Yann Le Du, place de Thierry Le Bihan dans la capture des savoir-faire.

      Soutenance : utilisez le mode `/jury` du projet Claude.
    livrables:
      - { id: architecture, nom: "Dossier d'architecture cible", format: "PDF ou page", description: "Schéma, choix argumentés, coûts, sécurité, supervision." }
      - { id: maquette-validation, nom: "Maquette de validation", format: "Image ou prototype", description: "Écran de relecture des brouillons." }
      - { id: pitch-deck, nom: "Pitch deck", format: "8-12 slides", description: "Orienté décision." }
      - { id: plan-accompagnement, nom: "Plan d'accompagnement et de formation", format: "Document", description: "Publics, objectifs évaluables, calendrier." }
    criteres:
      - { id: P4-C1, competence_id: C5.1, indicateur: "Architecture dimensionnée pour une PME sans DSI, réversible, intégrée à l'existant (Batipro sans API)" }
      - { id: P4-C2, competence_id: C5.2, indicateur: "Comparaison pondérée ≥ 2 options, hébergement UE argumenté, modèle de repli" }
      - { id: P4-C3, competence_id: C5.4, indicateur: "Indicateurs techniques et métier, seuils d'alerte, suivi des coûts" }
      - { id: P4-C4, competence_id: C7.1, indicateur: "Maquette de validation centrée sur l'ADV" }
      - { id: P4-C5, competence_id: C7.2, indicateur: "Pitch orienté décision, chiffré, objections du DAF traitées" }
      - { id: P4-C6, competence_id: C7.4, indicateur: "Plan de formation avec objectifs évaluables, lien avec l'art. 4 de l'AI Act" }
      - { id: P4-C7, competence_id: C1.3, indicateur: "Coûts d'exploitation cohérents avec la volumétrie mesurée" }
