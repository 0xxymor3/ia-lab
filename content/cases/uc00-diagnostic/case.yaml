brief:
  email:
    de: "Gwenola Talvern <g.talvern@menuiseries-talvern.fr>"
    a: "Consultant·e IA"
    date: "2026-09-14"
    objet: "Suite à notre échange — projet IA chez Talvern"
    corps_md: |
      Bonjour,

      Merci encore pour votre intervention à la matinale de la CCI, elle a fait beaucoup parler chez nous ! Comme convenu, je vous écris pour lancer quelque chose rapidement.

      En résumé, ce que je voudrais :

      1. **Un ChatGPT maison** qui réponde aux clients sur notre site et par email, 24 h/24, comme le font les grandes enseignes.
      2. **Automatiser les devis** : aujourd'hui on met une semaine à rappeler les gens et les concurrents répondent en 48 h.
      3. Que mes commerciaux **arrêtent de mettre les données clients dans ChatGPT** sur leur téléphone (Hervé m'a alertée, il a raison).
      4. **Former les équipes**, parce que certains sont très motivés et d'autres pas du tout.

      On reçoit entre 60 et 80 demandes de devis par semaine, et je pense qu'on en perd un tiers. Côté budget, on a prévu environ 15 à 20 k€ cette année. J'ai aussi entendu parler d'un diagnostic IA de Bpifrance, si ça peut aider.

      J'aimerais avoir quelque chose de visible avant le salon de l'habitat de décembre.

      Je vous joins quelques exports qu'Hervé et Soazig ont préparés. Soazig est un peu inquiète, je compte sur vous pour la rassurer.

      Bien cordialement,

      **Gwenola Talvern**
      Présidente — Menuiseries Talvern
  compte_rendu_md: |
    **Compte rendu — réunion de lancement du 10 septembre 2026 (notes prises par Maëlys Guillou)**

    Présents : Gwenola Talvern (présidente), Hervé Le Goff (DAF), Soazig Tanguy (ADV), Franck Jégou (commercial). Excusé : Erwan Cadoret (SAV, en chantier).

    - **Gwenola** : veut « un assistant qui répond tout seul aux clients » et « des devis automatiques ». Cite l'exemple d'un concurrent qui a un chatbot sur son site.
    - **Franck** : le vrai sujet, c'est le délai : « on rappelle au bout d'une semaine, parfois plus ». Il voudrait que chaque demande soit dans le CRM avec le bon commercial dans l'heure. Ne veut pas que « l'IA fasse les prix ».
    - **Hervé** : d'accord pour avancer mais « pas de données chez les Américains », et un coût mensuel maîtrisé. Rappelle que Relatio coûte 1 800 € par an et que « personne ne l'utilise ». Demande qui sera responsable si une réponse automatique est fausse.
    - **Soazig** : a passé deux semaines à noter son temps (fichier joint). Dit qu'elle passe « la moitié de ses journées à recopier ». Ne veut pas que des emails partent aux clients sans qu'elle les ait relus. Demande si « ça va remplacer quelqu'un ».
    - Chiffres évoqués en réunion : « 60 à 80 demandes de devis par semaine » (Gwenola), « une trentaine de vraies demandes, le reste c'est du SAV et du spam » (Soazig), « on répond en 3 jours » (Gwenola), « une semaine » (Franck). **Personne n'a de chiffre fiable.**
    - SAV : Erwan a fait passer le message que ses techniciens perdent « un temps fou » à chercher les notices et les conditions de garantie.
    - Divers : les candidatures spontanées (poseurs) arrivent aussi sur contact@ ; le chef d'atelier part en retraite en 2028 ; la facture électronique « on verra plus tard ».
    - **Points non tranchés** : qui valide les réponses envoyées aux clients ? Où sont hébergées les données ? Que fait-on des demandes reçues par téléphone ? Faut-il vraiment un chatbot sur le site ?
  contraintes:
    budget: "18 000 € HT en année 1 (conseil, formation, mise en œuvre, hors aides éventuelles) ; exploitation ≤ 250 € HT/mois"
    delai: "Premiers résultats visibles avant le 15 décembre 2026"
    techniques:
      - "Pas de DSI : un référent informatique à ~1 jour/semaine (Yann Le Du)"
      - "Google Workspace, CRM Relatio (API REST), ERP Batipro sans API (exports manuels)"
      - "Préférence forte pour un hébergement des données dans l'Union européenne"
      - "Solutions maintenables par le référent, documentées en français"
    reglementaires:
      - "RGPD : données de particuliers (identité, adresse, projet, photos de logement), candidatures, parfois coordonnées bancaires"
      - "AI Act : transparence envers les clients si une IA leur répond (art. 50) ; mesures de littératie IA pour les salariés (art. 4)"
      - "Facturation électronique : réception obligatoire depuis le 1er septembre 2026, émission au 1er septembre 2027"

